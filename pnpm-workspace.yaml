# pnpm settings (not a workspace — config only).
# @inco/lightning (the Solidity contracts pkg) was removed — it dragged in
# Foundry test libs via codeload tarballs that pnpm 12 can't verify. Only the
# pure-JS @inco/lightning-js SDK remains.
neverBuiltDependencies:
  - "@safe-global/safe-smart-account"

# Dependency build scripts we deliberately don't run — the app's own
# postinstall runs `prisma generate`, and Vercel builds have always skipped
# these. Listed explicitly because pnpm 12 hard-errors on ignored builds.
# pnpm 12 defaults strictDepBuilds to error on scripts not explicitly
# approved — restore the warn-only behavior.
strictDepBuilds: false

ignoredBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "@sentry/cli"
  - bufferutil
  - core-js
  - es5-ext
  - esbuild
  - keccak
  - prisma
  - protobufjs
  - secp256k1
  - sharp
  - unrs-resolver
  - utf-8-validate
  - web3
  - web3-bzz
  - web3-shh

# pnpm >=10 ignores the "pnpm" field in package.json — these live here.
overrides:
  "@safe-global/safe-smart-account": "1.5.0"
  "@base-org/account": "2.4.0"
  "@coinbase/wallet-sdk": "3.9.3"
  "@rainbow-me/rainbowkit": "2.2.11"
  viem: "2.48.8"
  ox: "0.14.20"

patchedDependencies:
  "@gelatonetwork/relay-sdk@5.7.0": "patches/@gelatonetwork__relay-sdk@5.7.0.patch"

